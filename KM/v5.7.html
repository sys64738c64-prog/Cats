        function getTimeDiffString(timestamp) {
            if (!timestamp) return "";
            const now = new Date();
            const then = new Date(timestamp);
            const diffMs = now - then;
            const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
            const diffMinutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));

            let diffString = "";
            if (diffHours > 0) diffString += `${diffHours} Std. `;
            diffString += `${diffMinutes} Min.`;
            return `(vor ${diffString})`;
        }

        function getCountdownString(endTime) {
            if (!endTime) return "";
            const now = new Date();
            const end = new Date(endTime);
            const diffMs = end - now;

            if (diffMs <= 0) return "abgelaufen";

            const diffMinutes = Math.floor(diffMs / (1000 * 60));
            const diffHours = Math.floor(diffMinutes / 60);
            const remainingMinutes = diffMinutes % 60;

            let diffString = "";
            if (diffHours > 0) diffString += `${diffHours}h `;
            diffString += `${remainingMinutes}m`;
            return `(noch ${diffString})`;
        }

            // Eindeutiger Schlüssel für diese Benachrichtigung
            const notificationKey = `${player}-${vehicle}-${status}-${Date.now()}`;
            const now = Date.now();

            // Prüfe auf doppelte Benachrichtigungen in den letzten 60 Sekunden
            const recentKeys = Array.from(sentNotifications.keys()).filter(key => {
                const keyTime = sentNotifications.get(key);
                return now - keyTime < 60000 && key.startsWith(`${player}-${vehicle}-${status}`);
            });

            if (recentKeys.length > 0) {
                console.log(`Doppelte Benachrichtigung verhindert: ${player}-${vehicle}-${status}`);
                return;
            }

            // Speichere diese Benachrichtigung
            sentNotifications.set(notificationKey, now);

            // Bereinige alte Einträge
            sentNotifications.forEach((time, key) => {
                if (now - time > 300000) {
                    sentNotifications.delete(key);
                }
            });

            // Für GB-Status: Sammle Benachrichtigungen
            if (status.startsWith('GB')) {
                addToGbQueue(player, vehicle, status);
                return;
            }


            
            // Bestimme die richtige Webhook-URL basierend auf dem Status
            let webhookUrl;
            if (status.startsWith('GB')) {
                webhookUrl = 'https://discordapp.com/api/webhooks/1489025162270474432/w5N6NCdVoqJLw77dQV4mMOTkE2d2qECYx02U4aWEQdYT60QrAfbvmu0ZMwTTm34-agqk';
            } else {
                // webhookUrl = 'https://discordapp.com/api/webhooks/1457170602673700894/3SHhHSwXQ6Cq5PLiJ1LyCUGz-Uytevtsv18uF5vYSPC3VgLaCmSFGWM77Lk3LW7B6Vju';
                webhookUrl = 'https://discordapp.com/api/webhooks/1495175798297067740/cdgROd9wD6PnCgKYbpdPuCT2SCwP4H2zmbl5_7C0z6CSyiFQAlDhRN-VCiuI4O0nnqus';
            }
            
            
            const select = document.querySelector(`select[data-player="${player}"][data-vehicle="${vehicle}"]`);
            const discordName = discordNames[player] || player;

            // Bestimme den anzuzeigenden Status
            let displayStatus = status;
            let originalGB = '';

            // Für gekillt-Status: Prüfe auf originalGB
            if (status === 'gekillt') {
                if (select && select.dataset.originalGB && select.dataset.originalGB.startsWith('GB')) {
                    originalGB = select.dataset.originalGB;
                    const gbNumber = originalGB.substring(2); // GB1 -> 1
                    displayStatus = `gekillt-${gbNumber}`;
                }
            }
            // Für gekillt-GB Status: Extrahiere GB-Nummer
            else if (status.startsWith('gekillt-GB')) {
                const gbNumber = status.substring(8); // gekillt-GB1 -> 1
                displayStatus = `gekillt-${gbNumber}`;
            }

            // Erstelle die Nachricht basierend auf der Konfiguration
            let message;

            // Funktion zum Senden der Nachricht mit 500ms Delay
            function sendWithDelay() {
                // Für gekillt-Status
                if (status === 'gekillt' || status.startsWith('gekillt-')) {
                    // Speichere originalGB im Dataset, falls noch nicht vorhanden
                    if (select && !select.dataset.originalGB && select.dataset.lastValue && select.dataset.lastValue.startsWith('GB')) {
                        select.dataset.originalGB = select.dataset.lastValue;
                        originalGB = select.dataset.lastValue;

                        // Aktualisiere auch in Firebase
                        const updates = {};
                        updates[`${player}/Fahrzeug ${vehicle}/originalGB`] = originalGB;
                        database.ref('Spieler').update(updates);
                    }

                    // Erstelle die Nachricht basierend auf der Konfiguration "gesetzte FZ Discord"
                    if (config.notification === 1) {
                        // Immer das Format: [Nummer] - [Name] Fz[Nummer]
                        let gbNumber = '';
                        if (originalGB && originalGB.startsWith('GB')) {
                            gbNumber = originalGB.substring(2);
                        } else if (displayStatus.startsWith('gekillt-')) {
                            gbNumber = displayStatus.replace('gekillt-', '');
                        }
                        if (gbNumber) {
                            message = `${gbNumber} - ${discordName} Fz${vehicle}`;
                        } else {
                            message = `${displayStatus} ${discordName} Fz${vehicle}`;
                        }
                    } else if (config.notification === 2) {
                        let gbNumber = '';
                        if (originalGB && originalGB.startsWith('GB')) {
                            gbNumber = originalGB.substring(2);
                        } else if (displayStatus.startsWith('gekillt-')) {
                            gbNumber = displayStatus.replace('gekillt-', '');
                        }
                        if (gbNumber) {
                            message = `${gbNumber} - ${config.id}`;
                            if (config.showName >= 1) message += ` ${discordName}`;
                            message += ` Fz${vehicle}`;
                        } else {
                            message = `${displayStatus} ${config.id}`;
                            if (config.showName >= 1) message += ` ${discordName}`;
                            message += ` Fz${vehicle}`;
                        }
                    }

                    // Sende mit fetch für bessere Zuverlässigkeit
                    fetch(webhookUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            content: message
                        })
                    }).then(response => {
                        console.log(`Discord-Benachrichtigung gesendet: ${message}`);
                    }).catch(error => {
                        console.error('Fehler beim Senden der Discord-Benachrichtigung:', error);
                    });
                    return;
                }

                // Für GB-Status: immer das Format von notification: 1, egal ob notification 1 oder 2
                if ((config.notification === 1 || config.notification === 2) && status.startsWith('GB')) {
                    const gbNumber = status.substring(2);
                    message = `${gbNumber} - ${discordName} Fz${vehicle}`;
                } else if (config.notification === 1) {
                    message = `${displayStatus} ${discordName} Fz${vehicle}`;
                } else {
                    // Für alle anderen notification-Werte keine Nachricht für GB-Status
                    return;
                }

                // Sende mit fetch für bessere Zuverlässigkeit
                fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: message
                    })
                }).then(response => {
                    console.log(`Discord-Benachrichtigung gesendet: ${message}`);
                }).catch(error => {
                    console.error('Fehler beim Senden der Discord-Benachrichtigung:', error);
                });
            }

            // 500ms Delay vor dem Senden
            setTimeout(sendWithDelay, 500);
        }

        // Neue Funktion: GB-Benachrichtigungen sammeln
        function addToGbQueue(player, vehicle, status) {
            const gbNumber = status.substring(2);

            if (!gbNotificationQueue.has(gbNumber)) {
                gbNotificationQueue.set(gbNumber, []);
            }

            const discordName = discordNames[player] || player;
            gbNotificationQueue.get(gbNumber).push(`${discordName} Fz${vehicle}`);

            // Timer zurücksetzen
            if (gbNotificationTimer) {
                clearTimeout(gbNotificationTimer);
            }

            // Nach 3 Sekunden alle gesammelten Nachrichten senden
            gbNotificationTimer = setTimeout(sendGroupedGbNotifications, 3000);
        }

        // Neue Funktion: Gesammelte GB-Benachrichtigungen senden (car-set)
        function sendGroupedGbNotifications() {
            const webhookUrl = 'https://discordapp.com/api/webhooks/1458185530406735873/g5HRS9ERd_hR1ZfsF6vsjgjoOFKqicbj3-eFjboUZEoXQ_XIWfDoc6HvvwhT-W8LtLeL';

            [...gbNotificationQueue.entries()].sort((a, b) => Number(a[0]) - Number(b[0])).forEach(([gbNumber, vehicles]) => {
                if (vehicles.length > 0) {
                    const message = vehicles.map(vehicle => `${gbNumber} - ${vehicle}`).join('\n');

                    fetch(webhookUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: message })
                    }).then(() => {
                        console.log(`GB${gbNumber} Gruppennachricht gesendet: ${message}`);
                    }).catch(error => {
                        console.error('Fehler beim Senden der GB-Gruppennachricht:', error);
                    });
                }
            });

            // Queue leeren
            gbNotificationQueue.clear();
            gbNotificationTimer = null;
        }

        function updateCellColor(select) {
            const cell = select.parentElement;
            cell.className = 'vehicle-cell';
            const value = select.value;

            const timestampElement = cell.querySelector('.time-stamp') || document.createElement('span');
            timestampElement.className = 'time-stamp';

            if (value !== "Rep") {
                const repInput = cell.querySelector('.rep-time-input');
                if (repInput) repInput.style.display = 'none';
            }

            if (value && value !== '') {
                if (select.value !== select.dataset.lastValue) {
                    if (value === "Rep") {
                        let minutes = parseInt(select.dataset.repMinutes) || DEFAULT_REP_MINUTES;
                        const inputMinutes = prompt("Reparaturzeit in Minuten (1-120):", minutes);

                        if (inputMinutes !== null) {
                            minutes = parseInt(inputMinutes) || DEFAULT_REP_MINUTES;
                            if (minutes < 1) minutes = 1;
                            if (minutes > 120) minutes = 120;

                            select.dataset.repMinutes = minutes;
                            const endTime = new Date();
                            endTime.setMinutes(endTime.getMinutes() + minutes);
                            select.dataset.endTime = endTime.toISOString();
                        } else {
                            select.value = select.dataset.lastValue || '';
                            updateCellColor(select);
                            updateRowColor(select.closest('tr'));
                            return;
                        }
                    }

                    select.dataset.originalTime = new Date().toISOString();
                    select.dataset.lastValue = select.value;

                    if (value === "gekillt" || value.startsWith("gekillt-")) {
                        const endTime = new Date();
                        endTime.setHours(endTime.getHours() + 2);
                        select.dataset.endTime = endTime.toISOString();
                    }
                }

                const timestamp = select.dataset.originalTime;
                const formattedTime = new Date(timestamp).toLocaleTimeString([], {
                    hour: '2-digit',
                    minute: '2-digit'
                });

                timestampElement.innerHTML = ` - ${formattedTime} <span class="duration">${getTimeDiffString(timestamp)}</span>`;

                if (value === "Rep" || value === "gekillt" || value.startsWith("gekillt-")) {
                    const endTime = select.dataset.endTime;
                    if (endTime) {
                        timestampElement.innerHTML += ` <span class="countdown" data-end-time="${endTime}">${getCountdownString(endTime)}</span>`;
                    }
                }

                timestampElement.dataset.originalTime = timestamp;
            } else {
                timestampElement.textContent = '';
                delete select.dataset.originalTime;
                delete select.dataset.lastValue;
                delete select.dataset.endTime;
                delete select.dataset.repMinutes;
            }

            if (!cell.contains(timestampElement)) {
                cell.appendChild(timestampElement);
            }

            // Styling anwenden
            const originalGB = select.dataset.originalGB;
            if (value === 'gekillt' && originalGB && originalGB.startsWith('GB')) {
                select.value = originalGB;
                select.style.backgroundColor = '#fd4444';
                select.style.color = 'white';
                cell.className = 'vehicle-cell gekillt-selection';
            } else if (value.startsWith('gekillt-')) {
                select.style.backgroundColor = '#fd4444';
                select.style.color = 'white';
                cell.className = 'vehicle-cell gekillt-selection';
            } else {
                select.style.backgroundColor = '';
                select.style.color = '';
                cell.className = 'vehicle-cell ' + (
                    value === '' ? 'no-selection' :
                        value === 'bereit' ? 'bereit-selection' :
                            value === 'gekillt' ? 'gekillt-selection' :
                                value.startsWith('GB') ? `${value.toLowerCase()}-selection` :
                                    value === 'Rep' ? 'rep-selection' :
                                        value === 'Res' ? 'res-selection' : ''
                );
            }
        }

        function updateRowColor(row) {
            const selects = row.querySelectorAll('select:not(.reps-select)');
            let allSet = true;
            let hasRep = false;
            let hasRes = false;
            let hasGB = false;

            selects.forEach(select => {
                const value = select.value;
                if (value === '') allSet = false;
                else if (value === 'Rep') hasRep = true;
                else if (value === 'Res') hasRes = true;
                else if (value.startsWith('GB')) hasGB = true;
            });

            const nameCell = row.querySelector('.player-name');
            nameCell.className = 'player-name';

            if (allSet) nameCell.classList.add('all-set');
            if (hasRep) nameCell.classList.add('has-rep');
            if (hasRes) nameCell.classList.add('has-res');
            if (hasGB) nameCell.classList.add('has-gb');

            // Reps-Zelle einfärben
            const repsCell = row.querySelector('.reps-cell');
            const repsSelect = row.querySelector('.reps-select');
            if (repsCell && repsSelect) {
                const repsValue = parseInt(repsSelect.value);
                repsCell.classList.remove('reps-cell-empty', 'reps-cell-0', 'reps-cell-1-2', 'reps-cell-3-19');

                if (repsSelect.value === '' || isNaN(repsValue)) {
                    repsCell.classList.add('reps-cell-empty');
                } else if (repsValue === 0) {
                    repsCell.classList.add('reps-cell-0');
                } else if (repsValue >= 1 && repsValue <= 2) {
                    repsCell.classList.add('reps-cell-1-2');
                } else if (repsValue >= 3 && repsValue <= 19) {
                    repsCell.classList.add('reps-cell-3-19');
                }
            }
        }

        function updateStatusOverview() {
            const statusGroups = {
                GB1: [], GB2: [], GB3: [], GB4: [], GB5: [], GB6: [],
                Rep: [], Res: [], bereit: [], gekillt: []
            };

            document.querySelectorAll('select').forEach(select => {
                const player = select.dataset.player;
                const value = select.value;

                if (value && value.startsWith('gekillt-')) {
                    statusGroups['gekillt'].push({
                        name: player,
                        time: select.dataset.originalTime || '',
                        vehicle: select.dataset.vehicle,
                        endTime: select.dataset.endTime || '',
                        repMinutes: select.dataset.repMinutes || ''
                    });
                } else if (value && statusGroups[value]) {
                    statusGroups[value].push({
                        name: player,
                        time: select.dataset.originalTime || '',
                        vehicle: select.dataset.vehicle,
                        endTime: select.dataset.endTime || '',
                        repMinutes: select.dataset.repMinutes || ''
                    });
                }
            });

            const overview = document.getElementById('status-overview');
            overview.innerHTML = '';

            const displayOrder = ['GB1', 'GB2', 'GB3', 'GB4', 'GB5', 'GB6', 'Rep', 'Res', 'bereit', 'gekillt'];

            displayOrder.forEach(status => {
                const players = statusGroups[status];
                if (players.length === 0) return;

                // Sortiere nach Zeitdifferenz (längste zuerst), dann nach players-Array Reihenfolge
                players.sort((a, b) => {
                    if (a.time && b.time) {
                        const now = new Date();
                        const diffA = Math.floor((now - new Date(a.time)) / (1000 * 60));
                        const diffB = Math.floor((now - new Date(b.time)) / (1000 * 60));
                        if (diffA !== diffB) return diffB - diffA;
                    } else if (a.time !== b.time) {
                        return a.time ? -1 : 1;
                    }
                    return players.indexOf(a.name) - players.indexOf(b.name);
                });

                const section = document.createElement('div');
                section.className = 'status-section';

                const header = document.createElement('div');
                header.className = 'status-header';

                const colorBox = document.createElement('span');
                colorBox.className = 'status-color';
                colorBox.style.backgroundColor = getComputedStyle(document.querySelector(`option[value="${status}"]`))?.backgroundColor || '#f0f0f0';

                header.appendChild(colorBox);
                header.appendChild(document.createTextNode(`${status} (${players.length})`));

                const playerList = document.createElement('div');
                playerList.className = 'player-list';

                players.forEach(player => {
                    const playerItem = document.createElement('span');
                    playerItem.className = 'player-item';

                    const timeDiff = getTimeDiffString(player.time);
                    const timeString = player.time ? new Date(player.time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

                    let additionalInfo = '';
                    if (status === 'Rep') {
                        additionalInfo = `<br><span class="player-time">${player.repMinutes || DEFAULT_REP_MINUTES} Min.</span>`;
                    }
                    if (status === 'Rep' || status === 'gekillt') {
                        additionalInfo += `<br><span class="player-time">${getCountdownString(player.endTime)}</span>`;
                    }

                    playerItem.innerHTML = `${player.name} (Fz${player.vehicle})<br>
                                          <span class="player-time">${timeString} ${timeDiff}</span>${additionalInfo}`;

                    playerList.appendChild(playerItem);
                });

                section.appendChild(header);
                section.appendChild(playerList);
                overview.appendChild(section);
            });
        }

        function saveVehicleToFirebase(player, vehicle, data) {
            const updates = {};
            const vehicleKey = `Fahrzeug ${vehicle}`;

            updates[`${player}/${vehicleKey}/Gebäude`] = data.status;
            updates[`${player}/${vehicleKey}/Slot`] = data.status.startsWith('GB') ? data.status : '';
            updates[`${player}/${vehicleKey}/timestamp`] = data.timestamp;
            updates[`${player}/${vehicleKey}/endTime`] = data.endTime || '';
            updates[`${player}/${vehicleKey}/repMinutes`] = data.repMinutes || '';

            // Speichere originalGB, wenn vorhanden
            if (data.originalGB) {
                updates[`${player}/${vehicleKey}/originalGB`] = data.originalGB;
            }

            return database.ref('Spieler').update(updates);
        }

        function saveDataToFirebase() {

                        updates[`${player}/${vehicleKey}/Slot`] = vehicleData.Slot;
                        updates[`${player}/${vehicleKey}/timestamp`] = vehicleData.timestamp;
                        updates[`${player}/${vehicleKey}/endTime`] = vehicleData.endTime;
                        updates[`${player}/${vehicleKey}/repMinutes`] = vehicleData.repMinutes;
                        updates[`${player}/${vehicleKey}/originalGB`] = vehicleData.originalGB || '';
                    }
                }
                const repsSelect = document.querySelector(`.reps-select[data-player="${player}"]`);
                if (repsSelect) {
                    const repsValue = parseInt(repsSelect.value);
                    updates[`${player}/Reps`] = isNaN(repsValue) ? "" : repsValue;
                }
            }

            return database.ref('Spieler').update(updates);
        }

        function getCurrentData() {
            const data = {};
            document.querySelectorAll('select').forEach(select => {
                const player = select.dataset.player;
                if (!data[player]) data[player] = {};

                if (select.classList.contains('reps-select')) {
                    data[player].Reps = parseInt(select.value) || "";
                } else {
                    const vehicleNum = select.dataset.vehicle;
                    if (vehicleNum) {
                        const vehicleKey = `Fahrzeug ${vehicleNum}`;
                        data[player][vehicleKey] = {
                            Gebäude: select.value,
                            Slot: select.value.startsWith('GB') ? select.value : '',
                            timestamp: select.dataset.originalTime || '',
                            endTime: select.dataset.endTime || '',
                            repMinutes: select.dataset.repMinutes || '',
                            originalGB: select.dataset.originalGB || ''
                        };
                    }
                }
            });
            return data;
        }

        function applyData(data) {
            // Nach dem Laden die Flagge zurücksetzen (am Ende der Funktion)
            const resetInitialLoad = () => initialLoad = false;
            setTimeout(resetInitialLoad, 1000);

            players.forEach(player => {
                for (let i = 1; i <= 3; i++) {
                    const vehicleKey = `Fahrzeug ${i}`;
                    const select = document.querySelector(`select[data-player="${player}"][data-vehicle="${i}"]`);
                    if (select && data[player] && data[player][vehicleKey]) {
                        const vehicleData = data[player][vehicleKey];

                        const shouldUpdate = (
                            select.value !== "gekillt" ||
                            !select.dataset.endTime ||
                            new Date(select.dataset.endTime) <= new Date()
                        );

                        if (shouldUpdate) {
                            const oldValue = select.value;
                            const newValue = vehicleData.Gebäude || '';

                            // Nur wenn sich der Wert tatsächlich ändert
                            const valueChanged = oldValue !== newValue;

                            select.value = newValue;
                            select.dataset.originalTime = vehicleData.timestamp || '';
                            select.dataset.lastValue = newValue;
                            select.dataset.endTime = vehicleData.endTime || '';
                            select.dataset.repMinutes = vehicleData.repMinutes || '';
                            select.dataset.originalGB = vehicleData.originalGB || '';

                            // Stelle sicher, dass gekillt-Status immer eine endTime haben
                            if ((newValue === 'gekillt' || newValue.startsWith('gekillt-')) && !vehicleData.endTime) {
                                const endTime = new Date();
                                endTime.setHours(endTime.getHours() + 2);
                                select.dataset.endTime = endTime.toISOString();

                                // Aktualisiere auch in Firebase
                                const updates = {};
                                updates[`${player}/${vehicleKey}/endTime`] = endTime.toISOString();
                                database.ref('Spieler').update(updates);
                            }

                            // Discord-Benachrichtigung nur bei echter Änderung und nicht beim initialen Laden
                            if (!initialLoad && valueChanged) {
                                if (newValue && newValue.startsWith('GB') && !newValue.startsWith('gekillt-')) {
                                    setTimeout(() => {
                                        sendDiscordNotification(player, i, newValue);
                                    }, 100);
                                } else if (newValue && (newValue === 'gekillt' || newValue.startsWith('gekillt-'))) {
                                    setTimeout(() => {
                                        sendDiscordNotification(player, i, 'gekillt');
                                    }, 100);
                                }
                            }

                            updateCellColor(select);
                        }
                    }
                }

                const repsSelect = document.querySelector(`.reps-select[data-player="${player}"]`);
                if (repsSelect && data[player] && data[player].Reps !== undefined) {
                    repsSelect.value = data[player].Reps;
                    updateRowColor(repsSelect.closest('tr'));
                }
            });

            updateFreeVehiclesCount();
            updateStatusOverview();
        }

        function resetAll() {
            console.log('resetAll aufgerufen');
            if (confirm('Alle Fahrzeugzuweisungen wirklich zurücksetzen?')) {
                console.log('Benutzer hat bestätigt');
                const updates = {};
                players.forEach(player => {
                    const cleanPlayer = player.replace(/^-/, '_'); // Ersetze führenden Bindestrich
                    updates[`${cleanPlayer}/Reps`] = "";
                    for (let i = 1; i <= 3; i++) {
                        const vehicleKey = `Fahrzeug ${i}`;
                        updates[`${cleanPlayer}/${vehicleKey}/Gebäude`] = "";
                        updates[`${cleanPlayer}/${vehicleKey}/Slot`] = "";
                        updates[`${cleanPlayer}/${vehicleKey}/timestamp`] = "";
                        updates[`${cleanPlayer}/${vehicleKey}/endTime`] = "";
                        updates[`${cleanPlayer}/${vehicleKey}/repMinutes`] = "";
                        updates[`${cleanPlayer}/${vehicleKey}/originalGB`] = "";
                    }
                });
                
                console.log('Updates:', updates);
                
                database.ref('Spieler').update(updates).then(() => {
                    console.log('Firebase Update erfolgreich');
                    document.querySelectorAll('select').forEach(select => {
                        select.value = '';
                        select.dataset.originalTime = '';
                        select.dataset.lastValue = '';
                        select.dataset.endTime = '';
                        select.dataset.repMinutes = '';
                        select.dataset.originalGB = '';
                        updateCellColor(select);
                        updateRowColor(select.closest('tr'));
                    });
                    updateFreeVehiclesCount();
                    updateStatusOverview();
                    console.log('UI Update abgeschlossen');
                }).catch(error => {
                    console.error('Firebase Fehler:', error);
                });
            } else {
                console.log('Benutzer hat abgebrochen');
            }
        }

        // ===== ECHTZEIT SYNCHRONISATION =====
        function setupRealtimeSync() {
            const statusElement = document.getElementById('sync-status');
            const dataRef = database.ref('Spieler');
            const gbRef = database.ref('Gebaeude');

            database.ref('.info/connected').on('value', (snapshot) => {
                if (snapshot.val() === true) {
                    statusElement.textContent = "Verbunden - Synchronisation aktiv";
                    statusElement.className = "sync-status online";
                } else {
                    statusElement.textContent = "Offline - Nur lokale Änderungen";
                    statusElement.className = "sync-status offline";
                }
            });

            dataRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    applyData(data);
                }
            });

            gbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                updateGbTimestamps(data);
            });

            setInterval(updateAllDurations, 60 * 1000);
            // Überprüfe regelmäßig alle gekillt-Status
            setInterval(checkAllKilledStatuses, 60 * 1000);
        }

        // ===== TABELLE ERSTELLEN =====
        function createTable() {
            const tableBody = document.getElementById('player-table');
            players.forEach(player => {
                const row = document.createElement('tr');

                // Spielername
                const nameCell = document.createElement('td');
                nameCell.className = 'player-name';
                nameCell.textContent = player;
                row.appendChild(nameCell);

                // Reps-Zelle
                const repsCell = document.createElement('td');
                repsCell.className = 'reps-cell';
                const repsSelect = document.createElement('select');
                repsSelect.className = 'reps-select';
                repsSelect.dataset.player = player;

                for (let i = 0; i <= 19; i++) {
                    const option = document.createElement('option');
                    option.value = i;
                    option.textContent = i;
                    repsSelect.appendChild(option);
                }
                repsSelect.value = ""; // Standardwert leer

                repsSelect.addEventListener('change', function () {
                    const player = this.dataset.player;
                    const repsValue = parseInt(this.value);
                    const updates = {};
                    updates[`${player}/Reps`] = isNaN(repsValue) ? "" : repsValue;
                    
                    database.ref('Spieler').update(updates).then(() => {
                        console.log(`Reps für ${player} gespeichert: ${this.value}`);
                    }).catch(error => {
                        console.error('Fehler beim Speichern der Reps:', error);
                    });
                    
                    updateRowColor(this.closest('tr'));
                });

                repsCell.appendChild(repsSelect);
                row.appendChild(repsCell);

                // Fahrzeug-Zellen
                for (let i = 0; i < 3; i++) {
                    const cell = document.createElement('td');
                    cell.className = 'vehicle-cell no-selection';
                    const select = document.createElement('select');
                    select.dataset.player = player;
                    select.dataset.vehicle = i + 1;

                    select.addEventListener('change', function () {
                        const oldValue = this.dataset.lastValue || '';
                        const newValue = this.value;
                        const player = this.dataset.player;
                        const vehicle = this.dataset.vehicle;

                        // Wenn auf ein Gebäude gesetzt wird, originalGB immer setzen
                        if (newValue.startsWith('GB') && !newValue.startsWith('gekillt-')) {
                            this.dataset.originalGB = newValue;
                            // Sende die Benachrichtigung mit minimaler Verzögerung
                            setTimeout(() => {
                                sendDiscordNotification(player, vehicle, newValue);
                            }, 100);
                        } else if ((newValue === 'gekillt' || newValue.startsWith('gekillt-')) && oldValue.startsWith('GB')) {
                            // Speichere das ursprüngliche GB, wenn ein Fahrzeug gekillt wird
                            this.dataset.originalGB = oldValue;
                            setTimeout(() => {
                                sendDiscordNotification(player, vehicle, 'gekillt');
                            }, 100);
                        } else if ((newValue === 'gekillt' || newValue.startsWith('gekillt-'))) {
                            // Sende die Benachrichtigung mit minimaler Verzögerung
                            setTimeout(() => {
                                sendDiscordNotification(player, vehicle, 'gekillt');
                            }, 100);
                        } else if (oldValue.startsWith('GB') && newValue !== oldValue) {
                            // Wenn von GB auf etwas anderes (außer gekillt) gewechselt wird, originalGB löschen
                            delete this.dataset.originalGB;
                        }

                        updateCellColor(this);
                        updateRowColor(this.closest('tr'));
                        updateFreeVehiclesCount();
                        updateStatusOverview();

                        // Stelle sicher, dass gekillt-Status immer eine endTime haben
                        if ((newValue === 'gekillt' || newValue.startsWith('gekillt-')) && !this.dataset.endTime) {
                            const endTime = new Date();
                            endTime.setHours(endTime.getHours() + 2);
                            this.dataset.endTime = endTime.toISOString();
                        }

                        const vehicleData = {
                            status: newValue,
                            timestamp: this.dataset.originalTime || new Date().toISOString(),
                            endTime: this.dataset.endTime,
                            repMinutes: this.dataset.repMinutes,
                            originalGB: this.dataset.originalGB || ''
                        };

                        saveVehicleToFirebase(player, vehicle, vehicleData);
                    });

                    options.forEach(option => {
                        const optionElement = document.createElement('option');
                        optionElement.value = option.value;
                        optionElement.textContent = option.text;

                        if (option.value.startsWith('gekillt-')) {
                            optionElement.style.display = 'none';
                            optionElement.hidden = true;
                            optionElement.disabled = true;
                        }

                        select.appendChild(optionElement);
                    });

                    cell.appendChild(select);
                    row.appendChild(cell);
                }
                tableBody.appendChild(row);
            });

            setupRealtimeSync();
            setInterval(updateAllDurations, 30000);
            updateFreeVehiclesCount();
            updateStatusOverview();
        }

        // ===== EVENT LISTENER =====
        
        // Reset Button Event Listener
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('reset-all').addEventListener('click', resetAll);
            console.log('Event Listeners hinzugefügt');
        });

        // Test-Funktion für GB-Farben
        function testGbColors() {
            database.ref('Gebaeude').once('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    // Hole alle GB-Emojis mit Nummern
                    const getEmojiWithNumber = (i) => {
                        const gbData = data[`GB${i}`] || {};
                        const farbe = gbData.farbe || 'Unbekannt';
                        const emoji = farbe === 'Rot' ? '🔴' :
                            farbe === 'Blau' ? '🔵' : '⚪';

                        // Nummern 1-3 vor Emoji, 4-6 nach Emoji
                        return i <= 3 ? `${i}${emoji}` : `${emoji}${i}`;
                    };

                    // V-förmiges Muster
                    const discordMessage = `${getEmojiWithNumber(1)}\u2003\u2003\u2003\u2003${getEmojiWithNumber(6)}\n\u2003${getEmojiWithNumber(2)}\u2003\u2003${getEmojiWithNumber(5)}\u2003\n\u2003\u2003${getEmojiWithNumber(3)}${getEmojiWithNumber(4)}\u2003\u2003`;

                    // Sende an Discord
                    const webhookUrl = 'https://discordapp.com/api/webhooks/1458186545365385340/y31xC9qA7a-wVDOTVZlZMuZqdrhTBlBas9w3gnpSBYM_rexnLotfllcD8zhx11ahFTHk';
                    fetch(webhookUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: discordMessage })
                    }).then(() => {
                        console.log('Test-Nachricht gesendet');
                    }).catch(error => {
                        console.error('Fehler beim Senden der Test-Nachricht:', error);
                    });
                }
            });
        }

        // ===== INITIALISIERUNG =====
        document.addEventListener('DOMContentLoaded', function () {
            createTable();
            // Überprüfe alle gekillt-Status beim Laden der Seite
            setTimeout(checkAllKilledStatuses, 2000);
            // Überprüfe alte gekillt-Status (>6 Stunden)
            setTimeout(resetOldKilledStatuses, 3000);
        });

        // Funktion zum Zurücksetzen alter gekillt-Status (>2 Stunden)
        function resetOldKilledStatuses() {
            const sixHoursAgo = new Date();
            sixHoursAgo.setHours(sixHoursAgo.getHours() - 2);

            let updates = {};
            let count = 0;

            document.querySelectorAll('select').forEach(select => {
                if (select.value === "gekillt" || select.value.startsWith("gekillt-")) {
                    // Fall 1: Kein endTime gesetzt
                    // Fall 2: originalTime ist älter als 6 Stunden
                    const originalTime = select.dataset.originalTime ? new Date(select.dataset.originalTime) : null;

                    if (!select.dataset.endTime || (originalTime && originalTime < sixHoursAgo)) {
                        console.log(`Zurücksetzen von altem gekillt-Status für ${select.dataset.player} Fz${select.dataset.vehicle}`);

                        select.value = "bereit";
                        select.dataset.lastValue = "bereit";
                        delete select.dataset.endTime;
                        delete select.dataset.repMinutes;
                        delete select.dataset.originalGB;

                        const player = select.dataset.player;
                        const vehicle = select.dataset.vehicle;

                        updates[`${player}/Fahrzeug ${vehicle}/Gebäude`] = "bereit";
                        updates[`${player}/Fahrzeug ${vehicle}/endTime`] = "";
                        updates[`${player}/Fahrzeug ${vehicle}/repMinutes`] = "";
                        updates[`${player}/Fahrzeug ${vehicle}/originalGB`] = "";
                        updates[`${player}/Fahrzeug ${vehicle}/timestamp`] = new Date().toISOString();

                        updateCellColor(select);
                        updateRowColor(select.closest('tr'));
                        count++;
                    }
                }
            });

            if (count > 0) {
                database.ref('Spieler').update(updates).then(() => {
                    updateFreeVehiclesCount();
                    updateStatusOverview();
                    console.log(`${count} alte gekillt-Status wurden zurückgesetzt.`);
                });
            }
        }

        // Funktion zum Überprüfen aller gekillt-Status
        function checkAllKilledStatuses() {
            document.querySelectorAll('select').forEach(select => {
                if (select.value === "gekillt" || select.value.startsWith("gekillt-")) {
                    const endTime = select.dataset.endTime;
                    if (endTime) {
                        const now = new Date();
                        const end = new Date(endTime);

                        // Wenn die Zeit abgelaufen ist oder mehr als 2 Stunden vergangen sind
                        if (now >= end) {
                            console.log(`Zurücksetzen von abgelaufenem gekillt-Status für ${select.dataset.player} Fz${select.dataset.vehicle}`);

                            select.value = "bereit";
                            select.dataset.lastValue = "bereit";
                            delete select.dataset.endTime;
                            delete select.dataset.repMinutes;
                            delete select.dataset.originalGB;

                            const updates = {};
                            const player = select.dataset.player;
                            const vehicle = select.dataset.vehicle;

                            updates[`${player}/Fahrzeug ${vehicle}/Gebäude`] = "bereit";
                            updates[`${player}/Fahrzeug ${vehicle}/endTime`] = "";
                            updates[`${player}/Fahrzeug ${vehicle}/repMinutes`] = "";
                            updates[`${player}/Fahrzeug ${vehicle}/originalGB`] = "";
                            updates[`${player}/Fahrzeug ${vehicle}/timestamp`] = new Date().toISOString();

                            database.ref('Spieler').update(updates).then(() => {
                                updateCellColor(select);
                                updateRowColor(select.closest('tr'));
                                updateFreeVehiclesCount();
                                updateStatusOverview();
                            });
                        }
                    } else {
                        // Wenn kein endTime gesetzt ist, setze es jetzt
                        const endTime = new Date();
                        endTime.setHours(endTime.getHours() + 2);
                        select.dataset.endTime = endTime.toISOString();

                        const updates = {};
                        const player = select.dataset.player;
                        const vehicle = select.dataset.vehicle;

                        updates[`${player}/Fahrzeug ${vehicle}/endTime`] = endTime.toISOString();
                        database.ref('Spieler').update(updates);
                    }
                }
            });
        }

        fetch(window.location.href)
            .then(response => {
                const lastModified = new Date(response.headers.get('Last-Modified'));
                const dateElement = document.createElement('div');
                dateElement.className = 'last-update';
                dateElement.textContent = 'Letzte Änderung: ' + lastModified.toLocaleString('de-DE');
                document.body.insertBefore(dateElement, document.querySelector('.controls'));
            })
            .catch(error => console.error('Fehler beim Abrufen des Änderungsdatums:', error));
    </script>
</body>
